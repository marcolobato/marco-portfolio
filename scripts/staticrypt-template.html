<!DOCTYPE html>
<!--
  Custom staticrypt template for marcolobato.info archive password gate.

  Preserves all /*[|placeholders|]*/0 and the staticrypt JavaScript verbatim.
  Only the visible HTML + CSS is customized to match the portfolio's design.

  To change copy: edit the CLI flags in scripts/encrypt-locked.sh, not this file.
  To change visual design: edit the <style> block below.
-->
<html class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- never cache: a returning visitor should re-evaluate the lock state -->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <link rel="icon" type="image/svg+xml" href="/mlobato-favicon.svg" />

    <!-- Same Fraunces (display) + Geist (body) the main site uses, so the
         prompt page reads as part of the site instead of a generic gate. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Geist:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Tokens duplicated as hex (not CSS variables from globals.css) because
         this template is a standalone HTML file — it has no link to the site's
         stylesheet. Values mirror src/styles/global.css. */
      :root {
        --bg: #ffffff;
        --surface: #f2f2f2;
        --fg: #1a1a1a;
        --muted: #808080;
        --border: #d9d9d9;
        --primary: #081f5d;
        --primary-hover: #0a2872;
        --focus-ring: #1040a8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --surface: #2e2e2e;
          --fg: #f2f2f2;
          --muted: #808080;
          --border: #4d4d4d;
          --primary: #c0d4f4;
          --primary-hover: #6090e0;
          --focus-ring: #6090e0;
        }
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body { height: 100%; margin: 0; }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Geist", system-ui, sans-serif;
        font-weight: 400;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Center the form vertically and horizontally on the viewport. */
      .staticrypt-content {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .staticrypt-page {
        width: 100%;
        max-width: 420px;
      }

      /* The form itself: no card, no shadow — just text and inputs on the bg. */
      .staticrypt-form { text-align: left; }

      .staticrypt-instructions { margin-bottom: 28px; }

      .staticrypt-title {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 28px;
        line-height: 1.2;
        color: var(--fg);
        margin: 0 0 10px;
      }

      .staticrypt-instructions p:not(.staticrypt-title) {
        font-size: 16px;
        color: var(--muted);
        margin: 0;
      }

      /* Hide the staticrypt default <hr> — the spacing handles separation. */
      .staticrypt-hr { display: none; }

      .staticrypt-password-container {
        position: relative;
        margin: 0 0 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: border-color 0.15s ease;
      }

      .staticrypt-password-container:focus-within {
        border-color: var(--primary);
      }

      .staticrypt-form input[type="password"],
      .staticrypt-form input[type="text"] {
        width: 100%;
        background: transparent;
        border: 0;
        outline: 0;
        padding: 14px 44px 14px 14px;
        font-family: inherit;
        font-size: 16px;
        color: var(--fg);
      }

      .staticrypt-form input::placeholder { color: var(--muted); }

      /* The eye icon is a black SVG. In light mode the default 0.6 opacity
         reads as muted gray. In dark mode we invert it to white and use
         higher opacity so it stays legible against the dark surface. */
      .staticrypt-toggle-password-visibility {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.15s ease;
      }

      .staticrypt-toggle-password-visibility:hover { opacity: 1; }

      @media (prefers-color-scheme: dark) {
        .staticrypt-toggle-password-visibility {
          filter: invert(1);
          opacity: 0.75;
        }
      }

      label.staticrypt-remember {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 24px;
        font-size: 14px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }

      .staticrypt-remember input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--primary);
        cursor: pointer;
      }

      .staticrypt-form .staticrypt-decrypt-button {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        font-family: inherit;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .staticrypt-form .staticrypt-decrypt-button:hover,
      .staticrypt-form .staticrypt-decrypt-button:focus {
        background: var(--primary-hover);
      }

      .staticrypt-form .staticrypt-decrypt-button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .hidden { display: none !important; }

      .staticrypt-spinner-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }

      .staticrypt-spinner {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-right-color: var(--primary);
        border-radius: 50%;
        animation: spinner-border 0.75s linear infinite;
      }

      @keyframes spinner-border {
        100% { transform: rotate(360deg); }
      }

      /* Prevent iOS Safari from zooming the page when the password field is
         focused. 16px input keeps the zoom-on-focus heuristic from firing. */
      @media screen and (-webkit-min-device-pixel-ratio: 0) {
        .staticrypt-form input[type="password"],
        .staticrypt-form input[type="text"] {
          font-size: 16px;
        }
      }
    </style>
  </head>

              />
            </div>

            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <!-- `checked` on this input makes "Remember me" tick by default.
                   Visitors who don't want to be remembered can uncheck. -->
              <input id="staticrypt-remember" type="checkbox" name="remember" checked />
              /*[|template_remember|]*/0
            </label>

            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
        </div>
      </div>
    </div>

    <script>
      // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      // you can edit these values to customize some of the behavior of StatiCrypt
      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      // init the staticrypt engine
      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      // try to automatically decrypt on load if there is a saved password
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

        // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
        // replaced, no need to do anything
        if (!isSuccessful) {
          // hide loading screen
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();

          // show the remember me checkbox
          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");

      const imgSrcEyeOpened =
        "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";

          passwordInput.type = "text";
          toggleIcon.src = imgSrcEyeOpened;
          toggleIcon.alt = templateToggleAltHide;
          toggleIcon.title = templateToggleAltHide;
        } else {
          passwordInput.type = "password";
          toggleIcon.src = imgSrcEyeClosed;
          toggleIcon.alt = templateToggleAltShow;
          toggleIcon.title = templateToggleAltShow;
        }

      // handle password form submission
      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;

        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

        if (!isSuccessful) {
          alert(templateError);
        }
      });

</html>
